# Extends keycloak.v2, not the legacy "keycloak" theme — keycloak.v2 (PatternFly v5)
# is the theme actually rendering by default on this Keycloak 26 install, confirmed
# by inspecting the bundled org.keycloak.keycloak-themes-26.0.8.jar.
parent=keycloak.v2
import=common/keycloak

# Replaces the parent's own css/styles.css entirely (same relative path, so ours
# wins theme-resource resolution) — deliberate, since the two things that file did
# (the dark keycloak-bg.png and the #kc-header-wrapper wordmark styling) are exactly
# what we're overriding anyway.
styles=css/styles.css
