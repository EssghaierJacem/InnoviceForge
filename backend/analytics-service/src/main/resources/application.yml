server:
  port: ${ANALYTICS_PORT:8083}

spring:
  application:
    name: analytics-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8181/realms/invoiceforge}
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_ANALYTICS_HOST:localhost}:${POSTGRES_ANALYTICS_PORT:5434}/analytics
    username: ${POSTGRES_USER:forge}
    password: ${POSTGRES_PASSWORD:forge}
  jpa:
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true