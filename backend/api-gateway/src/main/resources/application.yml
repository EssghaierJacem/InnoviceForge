server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8181/realms/invoiceforge}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ingestion-service
              uri: ${INGESTION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/invoices/**
            - id: analytics-service
              uri: ${ANALYTICS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/reports/**
            - id: ingestion-public
              uri: ${INGESTION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/public/invoices/**
            - id: analytics-public
              uri: ${ANALYTICS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/public/reports/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true