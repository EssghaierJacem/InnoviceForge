name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  POSTGRES_USER: forge
  POSTGRES_PASSWORD: forge

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start infra
        run: docker compose up -d --wait postgres-ingestion postgres-analytics rabbitmq redis minio keycloak

      - name: Dump infra logs
        if: failure()
        run: docker compose logs --no-color

      - name: mvn clean verify
        working-directory: backend
        run: mvn -B clean verify

      - name: Stop infra
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  parsing-service:
    name: Parsing service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parsing-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -e ".[dev]"
      - run: pytest
