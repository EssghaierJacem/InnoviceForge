name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api-gateway
            context: backend
            dockerfile: backend/api-gateway/Dockerfile
          - service: ingestion-service
            context: backend
            dockerfile: backend/ingestion-service/Dockerfile
          - service: analytics-service
            context: backend
            dockerfile: backend/analytics-service/Dockerfile
          - service: parsing-service
            context: parsing-service
            dockerfile: parsing-service/Dockerfile
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            VITE_API_BASE_URL=http://${{ vars.AZURE_VM_IP }}:8080
            VITE_KEYCLOAK_ISSUER=http://${{ vars.AZURE_VM_IP }}:8181/realms/invoiceforge
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/innoviceforge-${{ matrix.service }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/innoviceforge-${{ matrix.service }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.AZURE_VM_IP }}
          username: invoiceforge
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/invoiceforge
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.event.workflow_run.head_sha || github.sha }}/" .env
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
