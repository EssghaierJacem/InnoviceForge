[project]
name = "parsing-service"
version = "0.1.0"
description = "Consumes InvoiceUploaded events, extracts structured data via Gemini, publishes InvoiceParsed"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aio-pika>=10.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "minio>=7.2.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
