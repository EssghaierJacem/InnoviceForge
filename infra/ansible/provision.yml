---
- name: Provision InvoiceForge VM
  hosts: all
  become: true
  vars:
    app_dir: /opt/invoiceforge

  tasks:
    - name: Install Docker prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Add Docker's official GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch={{ ansible_architecture == 'aarch64' | ternary('arm64', 'amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine + Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Add admin user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Create app directory structure
      file:
        path: "{{ app_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - keycloak
        - keycloak/themes

    - name: Copy docker-compose files
      copy:
        src: "{{ playbook_dir }}/../../{{ item }}"
        dest: "{{ app_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - docker-compose.yml
        - docker-compose.prod.yml

    - name: Copy Keycloak theme
      copy:
        src: "{{ playbook_dir }}/../../keycloak/themes/invoiceforge"
        dest: "{{ app_dir }}/keycloak/themes/"
        mode: "0644"

    - name: Template Keycloak realm export (with the VM's public IP baked into the gateway client's redirect URIs)
      template:
        src: "{{ playbook_dir }}/../../keycloak/realm-export.json.j2"
        dest: "{{ app_dir }}/keycloak/realm-export.json"
        mode: "0644"
      vars:
        vm_public_ip: "{{ ansible_host }}"

    - name: Template .env
      template:
        src: templates/env.j2
        dest: "{{ app_dir }}/.env"
        mode: "0600"
      vars:
        vm_public_ip: "{{ ansible_host }}"

    - name: Pull and start the stack
      shell: |
        cd {{ app_dir }}
        docker compose -f docker-compose.yml -f docker-compose.prod.yml pull || true
        docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans || true
      args:
        executable: /bin/bash
